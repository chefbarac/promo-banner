<!doctype html>
<html lang="en">
    <head>
        <link rel="icon" href="https://chefbarac.github.io/promo-banner/github.jpg" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CHEFREL BARACOL | Support the Creator</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    "Segoe UI",
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: transparent;
                color: #f5f5f5;
                margin: 0;
                padding: 0;
                /* overflow removed so the fixed menu can escape the 72 px box */
            }

            .banner {
                display: flex;
                align-items: center;
                width: 100%;
                height: 72px;
                min-height: 72px;
                background: linear-gradient(90deg, #0d0d0d 0%, #161616 50%, #0d0d0d 100%);
                border: 1px solid #2a2a2a;
                border-radius: 12px;
                box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
                padding: 0 12px;
                gap: 12px;
                overflow: hidden;
            }

            /* Logo + Name */
            .brand {
                display: flex;
                align-items: center;
                gap: 9px;
                flex-shrink: 0;
                padding-right: 12px;
                border-right: 1px solid #2e2e2e;
                cursor: pointer;
                transition: opacity 0.15s;
            }

            .brand:hover {
                opacity: 0.85;
            }

            .logo {
                width: 40px;
                height: 40px;
                border-radius: 9px;
                object-fit: cover;
                border: 1.5px solid rgba(255, 140, 0, 0.5);
                box-shadow: 0 2px 8px rgba(255, 140, 0, 0.25);
                flex-shrink: 0;
            }

            .name-block {
                line-height: 1.15;
            }

            .name-block h1 {
                font-size: 0.9rem;
                font-weight: 800;
                color: #fff;
                letter-spacing: 0.3px;
                white-space: nowrap;
            }

            .name-block .powered {
                font-size: 0.65rem;
                color: #ff8c00;
                font-weight: 600;
                white-space: nowrap;
            }

            /* Support text */
            .support-text {
                font-size: 0.75rem;
                color: #aaa;
                white-space: nowrap;
                flex-shrink: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .support-text strong {
                color: #ff8c00;
                font-weight: 700;
            }

            /* Socials */
            .socials {
                display: flex;
                align-items: center;
                gap: 7px;
                margin-left: auto;
                flex-shrink: 1;
                min-width: 0;
            }

            .social {
                display: flex;
                align-items: center;
                gap: 6px;
                text-decoration: none;
                color: #eee;
                background: #1a1a1a;
                border: 1px solid #2c2c2c;
                border-radius: 50px;
                padding: 3px 9px 3px 3px;
                transition:
                    border-color 0.15s,
                    background 0.15s,
                    transform 0.15s;
                white-space: nowrap;
                flex-shrink: 0;
            }

            .social:hover {
                border-color: #ff8c00;
                background: #222;
                transform: translateY(-1px);
            }

            .social .avatar {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                object-fit: cover;
                border: 1.5px solid #333;
                flex-shrink: 0;
            }

            .social .icon {
                width: 16px;
                height: 16px;
                flex-shrink: 0;
                fill: currentColor;
            }

            .social .handle {
                font-size: 0.7rem;
                font-weight: 600;
                color: #ddd;
                max-width: 95px;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            /* ===== APPS button ===== */
            .apps-dropdown {
                position: relative;
                flex-shrink: 0;
            }

            .apps-btn {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                background: linear-gradient(135deg, #ff8c00, #e06b00);
                color: #111;
                font-weight: 700;
                font-size: 0.72rem;
                padding: 7px 12px;
                border-radius: 50px;
                border: none;
                cursor: pointer;
                white-space: nowrap;
                box-shadow: 0 3px 12px rgba(255, 140, 0, 0.3);
                transition:
                    transform 0.15s,
                    box-shadow 0.15s;
                font-family: inherit;
            }

            .apps-btn:hover,
            .apps-dropdown.open .apps-btn {
                transform: translateY(-1px);
                box-shadow: 0 5px 16px rgba(255, 140, 0, 0.4);
            }

            .apps-btn svg {
                width: 12px;
                height: 12px;
                fill: currentColor;
                transition: transform 0.2s;
            }

            .apps-dropdown.open .apps-btn svg {
                transform: rotate(180deg);
            }

            /* ===== Fixed portal menu (escapes any overflow) ===== */
            .apps-menu {
                position: fixed;
                min-width: 200px;
                background: #1a1a1a;
                border: 1px solid #2c2c2c;
                border-radius: 10px;
                box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
                padding: 6px;
                opacity: 0;
                visibility: hidden;
                transform: translateY(-4px);
                transition:
                    opacity 0.18s,
                    visibility 0.18s,
                    transform 0.18s;
                z-index: 99999; /* top-most */
                pointer-events: none;
            }

            .apps-menu.open {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
                pointer-events: auto;
            }

            .apps-menu a {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 9px 12px;
                color: #eee;
                text-decoration: none;
                font-size: 0.78rem;
                font-weight: 600;
                border-radius: 7px;
                transition: background 0.15s;
            }

            .apps-menu a:hover {
                background: #2a2a2a;
                color: #ff8c00;
            }

            .apps-menu .divider {
                height: 1px;
                background: #2e2e2e;
                margin: 4px 0;
            }

            /* ===== Responsive ===== */
            @media (max-width: 820px) {
                .support-text {
                    display: none;
                }
                .banner {
                    gap: 10px;
                }
            }

            @media (max-width: 640px) {
                .social .handle {
                    display: none;
                }
                .social {
                    padding: 3px;
                    border-radius: 50%;
                }
                .banner {
                    gap: 8px;
                    padding: 0 10px;
                }
                .brand {
                    padding-right: 10px;
                }
            }

            @media (max-width: 480px) {
                .name-block .powered {
                    display: none;
                }
                .name-block h1 {
                    font-size: 0.8rem;
                }
                .logo {
                    width: 34px;
                    height: 34px;
                }
                .apps-btn {
                    padding: 6px 10px;
                    font-size: 0.68rem;
                }
                .social .avatar {
                    width: 26px;
                    height: 26px;
                }

                .social:nth-child(3),
                .social:nth-child(4) {
                    display: none;
                }
            }

            @media (max-width: 380px) {
                .name-block {
                    display: none;
                }
                .brand {
                    border-right: none;
                    padding-right: 0;
                }
                .apps-btn span {
                    display: none;
                }
                .apps-btn {
                    padding: 7px;
                    border-radius: 50%;
                }

                .social:nth-child(2) {
                    display: none;
                }
            }

            @media (max-width: 300px) {
                .socials {
                    display: none;
                }
            }
        </style>
    </head>
    <body>

        <script>
            const dropdown = document.getElementById("appsDropdown");
            const btn = document.getElementById("appsBtn");
            const menu = document.getElementById("appsMenu");
            const brandLink = document.getElementById("brandLink");

            // Navigate to portfolio when the brand block is clicked
            brandLink.addEventListener("click", () => {
                window.open("https://chefbarac.github.io/portfolio/?source=promo-banner", "_blank", "noopener");
            });

            // Portal the menu to <body> so it escapes every overflow:hidden ancestor
            document.body.appendChild(menu);

            function positionMenu() {
                const rect = btn.getBoundingClientRect();
                const menuHeight = menu.offsetHeight || 320; // approximate if not yet visible
                const spaceBelow = window.innerHeight - rect.bottom;
                const spaceAbove = rect.top;

                // Prefer opening downward; fall back to upward if not enough room
                if (spaceBelow >= menuHeight + 12 || spaceBelow >= spaceAbove) {
                    menu.style.top = rect.bottom + 8 + "px";
                    menu.style.bottom = "auto";
                } else {
                    menu.style.bottom = window.innerHeight - rect.top + 8 + "px";
                    menu.style.top = "auto";
                }

                // Align right edge of menu with right edge of button
                menu.style.left = "auto";
                menu.style.right = window.innerWidth - rect.right + "px";
            }

            function openMenu() {
                positionMenu();
                menu.classList.add("open");
                dropdown.classList.add("open");
                btn.setAttribute("aria-expanded", "true");
            }

            function closeMenu() {
                menu.classList.remove("open");
                dropdown.classList.remove("open");
                btn.setAttribute("aria-expanded", "false");
            }

            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                if (menu.classList.contains("open")) {
                    closeMenu();
                } else {
                    openMenu();
                }
            });

            // Close on outside click
            document.addEventListener("click", (e) => {
                if (!menu.contains(e.target) && !btn.contains(e.target)) {
                    closeMenu();
                }
            });

            // Reposition on resize / scroll
            window.addEventListener("resize", () => {
                if (menu.classList.contains("open")) positionMenu();
            });
            window.addEventListener(
                "scroll",
                () => {
                    if (menu.classList.contains("open")) positionMenu();
                },
                true,
            );

            // Service worker
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker.register("sw.js").catch((err) => {
                        console.error("SW registration failed:", err);
                    });
                });

                let refreshing = false;
                navigator.serviceWorker.addEventListener("controllerchange", () => {
                    if (refreshing) return;
                    refreshing = true;
                    window.location.reload();
                });
            }
        </script>
