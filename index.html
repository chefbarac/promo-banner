<!doctype html>
<html lang="en">
    <head>
        <link rel="icon" href="https://chefbarac.github.io/promo-banner/github.jpg" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CHEFREL BARACOL | Sponsored Promo Marquee</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    "Segoe UI",
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: transparent;
                color: #f5f5f5;
                margin: 0;
                padding: 0;
            }

            .banner {
                display: flex;
                align-items: center;
                width: 100%;
                height: 72px;
                min-height: 72px;
                max-height: 72px;
                background: linear-gradient(90deg, #0d0d0d 0%, #161616 50%, #0d0d0d 100%);
                border: 1px solid #2a2a2a;
                border-radius: 12px;
                box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
                padding: 0 12px;
                gap: 12px;
                overflow: hidden;
            }

            /* Logo + Name */
            .brand {
                display: flex;
                align-items: center;
                gap: 9px;
                flex-shrink: 0;
                padding-right: 12px;
                border-right: 1px solid #2e2e2e;
                cursor: pointer;
                transition: opacity 0.15s;
            }

            .brand:hover {
                opacity: 0.85;
            }

            .logo {
                width: 40px;
                height: 40px;
                border-radius: 9px;
                object-fit: cover;
                border: 1.5px solid rgba(255, 140, 0, 0.5);
                box-shadow: 0 2px 8px rgba(255, 140, 0, 0.25);
                flex-shrink: 0;
            }

            .name-block {
                line-height: 1.15;
            }

            .name-block h1 {
                font-size: 0.9rem;
                font-weight: 800;
                color: #fff;
                letter-spacing: 0.3px;
                white-space: nowrap;
            }

            .name-block .powered {
                font-size: 0.65rem;
                color: #ff8c00;
                font-weight: 600;
                white-space: nowrap;
            }

            /* Shared strip for AD / socials / apps — takes remaining space */
            .strip {
                display: flex;
                align-items: center;
                gap: 7px;
                margin-left: auto;
                flex: 1 1 auto;
                min-width: 0;
                overflow-x: auto;
                overflow-y: hidden;
                scrollbar-width: none;
                -ms-overflow-style: none;
                height: 100%;
            }

            .strip::-webkit-scrollbar {
                display: none;
            }

            /* ===== Sponsored ad marquee ===== */
            .ad-track {
                display: flex;
                align-items: center;
                gap: 9px;
                width: 100%;
                height: 100%;
                text-decoration: none;
                color: inherit;
                cursor: pointer;
                border-radius: 8px;
                outline: none;
            }

            .ad-track:focus-visible {
                box-shadow: 0 0 0 2px #ff8c00;
            }

            .ad-logo {
                width: 32px;
                height: 32px;
                border-radius: 7px;
                object-fit: cover;
                border: 1.5px solid rgba(255, 140, 0, 0.5);
                flex-shrink: 0;
            }

            .ad-marquee-viewport {
                flex: 1 1 auto;
                min-width: 0;
                overflow: hidden;
                white-space: nowrap;
                height: 100%;
                display: flex;
                align-items: center;
            }

            .ad-marquee-content {
                display: inline-flex;
                align-items: center;
                white-space: nowrap;
                padding-left: 100%;
                animation: promo-marquee var(--marquee-duration, 16s) linear infinite;
                will-change: transform;
            }

            @keyframes promo-marquee {
                from {
                    transform: translateX(0);
                }
                to {
                    transform: translateX(-100%);
                }
            }

            .ad-track:hover .ad-marquee-content,
            .ad-track:focus-visible .ad-marquee-content,
            .strip.paused .ad-marquee-content {
                animation-play-state: paused;
            }

            .ad-label {
                color: #ff8c00;
                font-weight: 700;
                font-size: 0.68rem;
                letter-spacing: 0.4px;
                margin-right: 5px;
            }

            .ad-advertiser {
                color: #fff;
                font-weight: 800;
                font-size: 0.78rem;
                margin-right: 5px;
            }

            .ad-message {
                color: #cfcfcf;
                font-size: 0.75rem;
                margin-right: 8px;
            }

            .ad-cta {
                display: inline-flex;
                align-items: center;
                gap: 3px;
                color: #111;
                background: linear-gradient(135deg, #ff8c00, #e06b00);
                font-weight: 700;
                font-size: 0.68rem;
                padding: 3px 9px;
                border-radius: 50px;
                white-space: nowrap;
            }

            @media (prefers-reduced-motion: reduce) {
                .ad-marquee-content {
                    animation: none;
                    padding-left: 0;
                    text-overflow: ellipsis;
                    overflow: hidden;
                    max-width: 100%;
                }
            }

            /* Social pills */
            .social {
                display: flex;
                align-items: center;
                gap: 6px;
                text-decoration: none;
                color: #eee;
                background: #1a1a1a;
                border: 1px solid #2c2c2c;
                border-radius: 50px;
                padding: 3px 9px 3px 3px;
                transition:
                    border-color 0.15s,
                    background 0.15s,
                    transform 0.15s;
                white-space: nowrap;
                flex-shrink: 0;
            }

            .social:hover {
                border-color: #ff8c00;
                background: #222;
                transform: translateY(-1px);
            }

            .social .avatar {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                object-fit: cover;
                border: 1.5px solid #333;
                flex-shrink: 0;
            }

            .social .icon {
                width: 16px;
                height: 16px;
                flex-shrink: 0;
                fill: currentColor;
            }

            .social .handle {
                font-size: 0.7rem;
                font-weight: 600;
                color: #ddd;
                max-width: 95px;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            /* App pills */
            .app {
                display: inline-flex;
                align-items: center;
                justify-content: flex-start;
                text-decoration: none;
                color: #eee;
                background: #1a1a1a;
                border: 1px solid #2c2c2c;
                border-radius: 50px;
                padding: 6px 11px;
                font-size: 0.7rem;
                font-weight: 600;
                white-space: nowrap;
                flex: 1 1 auto;
                min-width: 0;
                max-width: 140px;
                overflow: hidden;
                text-overflow: ellipsis;
                transition:
                    border-color 0.15s,
                    background 0.15s,
                    color 0.15s,
                    transform 0.15s;
            }

            .app:hover {
                border-color: #ff8c00;
                background: #222;
                color: #ff8c00;
                transform: translateY(-1px);
            }

            .app.soon {
                opacity: 0.55;
                pointer-events: none;
                border-style: dashed;
            }

            /* Toggle button */
            .toggle-btn {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                background: linear-gradient(135deg, #ff8c00, #e06b00);
                color: #111;
                font-weight: 700;
                font-size: 0.72rem;
                padding: 7px 12px;
                border-radius: 50px;
                border: none;
                cursor: pointer;
                white-space: nowrap;
                box-shadow: 0 3px 12px rgba(255, 140, 0, 0.3);
                transition:
                    transform 0.15s,
                    box-shadow 0.15s;
                font-family: inherit;
                flex-shrink: 0;
            }

            .toggle-btn:hover {
                transform: translateY(-1px);
                box-shadow: 0 5px 16px rgba(255, 140, 0, 0.4);
            }

            .toggle-btn svg {
                width: 12px;
                height: 12px;
                fill: currentColor;
                transition: transform 0.2s;
            }

            /* ===== Responsive ===== */
            @media (max-width: 640px) {
                .social .handle {
                    display: none;
                }
                .social {
                    padding: 3px;
                    border-radius: 50%;
                }
                .banner {
                    gap: 8px;
                    padding: 0 10px;
                }
                .brand {
                    padding-right: 10px;
                }
                .app {
                    padding: 6px 9px;
                    font-size: 0.65rem;
                    max-width: 110px;
                }
                .ad-message {
                    display: none;
                }
            }

            @media (max-width: 480px) {
                .name-block .powered {
                    display: none;
                }
                .name-block h1 {
                    font-size: 0.8rem;
                }
                .logo {
                    width: 34px;
                    height: 34px;
                }
                .toggle-btn {
                    padding: 6px 10px;
                    font-size: 0.68rem;
                }
                .social .avatar {
                    width: 26px;
                    height: 26px;
                }
                .ad-logo {
                    width: 26px;
                    height: 26px;
                }
                .social:nth-child(3),
                .social:nth-child(4) {
                    display: none;
                }
            }

            @media (max-width: 380px) {
                .name-block {
                    display: none;
                }
                .brand {
                    border-right: none;
                    padding-right: 0;
                }
                .toggle-btn span {
                    display: none;
                }
                .toggle-btn {
                    padding: 7px;
                    border-radius: 50%;
                }
                .ad-label {
                    display: none;
                }
                .social:nth-child(2) {
                    display: none;
                }
            }

            @media (max-width: 300px) {
                .strip.socials-mode,
                .strip.apps-mode {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="banner">
            <!-- Brand -->
            <div class="brand" id="brandLink" title="View portfolio">
                <img src="icon print circle copy.png" alt="Icon Print" class="logo" />
                <div class="name-block">
                    <h1>CHEFREL BARACOL</h1>
                    <div class="powered">powered by Icon Print</div>
                </div>
            </div>

            <!-- Strip: ad marquee by default, toggles to apps / socials -->
            <div class="strip ad-mode" id="strip"></div>

            <!-- Toggle button: cycles AD -> APPS -> SOCIALS -> AD -->
            <button class="toggle-btn" type="button" id="toggleBtn" title="Show apps">
                <span id="toggleLabel">APPS</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z" /></svg>
            </button>
        </div>

        <script>
            /* =========================================================
               1. GA4 SETUP (safe — banner must keep working if this fails)
               ========================================================= */
            const GA_MEASUREMENT_ID = "G-JV2MEQ34T2"; // TODO: replace with your real GA4 Measurement ID

            (function loadGA4(id) {
                try {
                    if (!id || id.indexOf("XXXX") !== -1) return; // not configured yet — skip silently
                    const s = document.createElement("script");
                    s.async = true;
                    s.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
                    document.head.appendChild(s);
                    window.dataLayer = window.dataLayer || [];
                    window.gtag = function () {
                        window.dataLayer.push(arguments);
                    };
                    gtag("js", new Date());
                    gtag("config", id, { send_page_view: false });
                } catch (e) {
                    /* GA4 must never break the banner */
                }
            })(GA_MEASUREMENT_ID);

            function trackEvent(name, params) {
                try {
                    if (typeof gtag === "function") gtag("event", name, params);
                } catch (e) {
                    /* fail silently */
                }
            }

            /* =========================================================
               2. CAMPAIGN CONFIGURATION
               ========================================================= */
            const campaigns = [
                {
                    id: "moy-barbershop-september-2026",
                    advertiser: "Moy Barbershop",
                    logo: "/promo-img/Moy Barbershop.webp",
                    message: "Quality Haircuts • Kids Cuts • Styling",
                    cta: "VISIT NOW",
                    url: "https://www.facebook.com/profile.php?id=61592844604811",
                    start: "2026-09-01",
                    end: "2026-09-30",
                    active: true,
                },
                {
                    id: "regie-gawang-inato-2026",
                    advertiser: "Regie",
                    logo: "/promo-img/Regie Gawang Inato.webp",
                    message: "Gawang Inato",
                    cta: "VISIT NOW",
                    url: "https://www.facebook.com/regie.carillio?comment_id=Y29tbWVudDo0Mzc1NzQ3OTk1OTc2NjA1XzE3NDI0NjkzNjM0NjcxMzc%3D",
                    start: "2026-09-01",
                    end: "2026-09-30",
                    active: true,
                },
            ];

            const houseCampaign = {
                id: "house",
                advertiser: "Icon Print",
                logo: "icon print circle copy.png",
                message: "Rush ID • Photo Print • Stickers",
                cta: "EXPLORE",
                url: "https://chefbarac.github.io/?source=promo-banner",
                type: "house",
            };

            /* =========================================================
               3. ACTIVE-CAMPAIGN SELECTION + ROTATION
               ========================================================= */
            function isCampaignActiveToday(c) {
                if (!c.active) return false;
                const today = new Date().toISOString().slice(0, 10);
                if (c.start && today < c.start) return false;
                if (c.end && today > c.end) return false;
                return true;
            }

            function getActiveCampaigns() {
                return campaigns.filter(isCampaignActiveToday).map((c) => ({ ...c, type: c.type || "paid" }));
            }

            // Simple round-robin rotation, persisted in localStorage so
            // repeat visitors see a fair, evenly-distributed sequence
            // of advertisers over time (see explanation for why this
            // beats pure random or a setInterval-based timed rotation
            // for a small single-slot inventory).
            function pickCampaign(list) {
                if (!list.length) return houseCampaign;
                if (list.length === 1) return list[0];
                const key = "promoRotationIndex";
                let idx = parseInt(localStorage.getItem(key) || "0", 10);
                if (isNaN(idx) || idx < 0) idx = 0;
                const campaign = list[idx % list.length];
                localStorage.setItem(key, String((idx + 1) % list.length));
                return campaign;
            }

            const currentCampaign = pickCampaign(getActiveCampaigns());

            /* =========================================================
               4. UTM HELPER
               ========================================================= */
            function withUTM(campaign) {
                if (campaign.type === "house") return campaign.url;
                try {
                    const url = new URL(campaign.url);
                    if (!url.searchParams.has("utm_source")) url.searchParams.set("utm_source", "chefrel_banner");
                    if (!url.searchParams.has("utm_medium")) url.searchParams.set("utm_medium", "display");
                    if (!url.searchParams.has("utm_campaign")) url.searchParams.set("utm_campaign", campaign.id);
                    return url.toString();
                } catch (e) {
                    return campaign.url;
                }
            }

            /* =========================================================
               5. RENDER: ad marquee / socials / apps
               ========================================================= */
            const strip = document.getElementById("strip");
            const toggleBtn = document.getElementById("toggleBtn");
            const toggleLabel = document.getElementById("toggleLabel");
            const brandLink = document.getElementById("brandLink");

            brandLink.addEventListener("click", () => {
                window.open("https://chefbarac.github.io/portfolio/?source=promo-banner", "_blank", "noopener");
            });

            const socialsHTML = `
                <a class="social" href="https://facebook.com/chefrelbaracol" target="_blank" rel="noopener" title="Facebook /chefrelbaracol">
                    <img src="facebook.jpg" alt="" class="avatar" />
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                    <span class="handle">/chefrelbaracol</span>
                </a>
                <a class="social" href="https://tiktok.com/@chefrelbaracol" target="_blank" rel="noopener" title="TikTok @chefrelbaracol">
                    <img src="tikotk.jpeg" alt="" class="avatar" />
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>
                    </svg>
                    <span class="handle">@chefrelbaracol</span>
                </a>
                <a class="social" href="mailto:chefrelbarac@gmail.com" title="Email chefrelbarac@gmail.com">
                    <img src="gmail.jpg" alt="" class="avatar" />
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                    <span class="handle">chefrelbarac@gmail.com</span>
                </a>
                <a class="social" href="https://github.com/chefbarac" target="_blank" rel="noopener" title="GitHub /chefbarac">
                    <img src="github.jpg" alt="" class="avatar" />
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
                    </svg>
                    <span class="handle">/chefbarac</span>
                </a>
            `;

            const appsHTML = `
                <a class="app" href="https://chefbarac.github.io/iconprint/?source=promo-banner" target="_blank" rel="noopener" title="Auto Stitch">Stitch</a>
                <a class="app" href="https://chefbarac.github.io/iconprint/moreapps/idcopy.html?source=promo-banner" target="_blank" rel="noopener" title="ID Copy">ID Copy</a>
                <a class="app" href="https://chefbarac.github.io/iconprint/moreapps/rushid.html?source=promo-banner" target="_blank" rel="noopener" title="Rush ID">Rush ID</a>
                <a class="app" href="https://chefbarac.github.io/iconprint/moreapps/photoprint.html?source=promo-banner" target="_blank" rel="noopener" title="Photo Print">Photo Print</a>
                <a class="app" href="https://chefbarac.github.io/iconprint/moreapps/b2blamination.html?source=promo-banner" target="_blank" rel="noopener" title="B2B Lamination">B2B Lamination</a>
                <a class="app" href="https://chefbarac.github.io/iconprint/moreapps/autocollage.html?source=promo-banner" target="_blank" rel="noopener" title="Auto Collage">Collage</a>
                <a class="app" href="https://chefbarac.github.io/iconprint/moreapps/stickerrepeat.html?source=promo-banner" target="_blank" rel="noopener" title="Sticker Repeat">Sticker</a>
                <a class="app" href="https://chefbarac.github.io/smartcalculator/?source=promo-banner" target="_blank" rel="noopener" title="Smart Calcu">Calcu</a>
                <a class="app" href="https://chefbarac.github.io/costing/?source=promo-banner" target="_blank" rel="noopener" title="Costing">Costing</a>
                <a class="app" href="https://chefbarac.github.io/pos/?source=promo-banner" target="_blank" rel="noopener" title="POS">POS</a>
                <span class="app soon" title="More apps coming soon">More soon…</span>
            `;

            function adHTML(campaign) {
                const isHouse = campaign.type === "house";
                const labelSpan = isHouse ? "" : `<span class="ad-label">SPONSORED</span>`;
                return `
                    <a class="ad-track" id="adLink" href="${withUTM(campaign)}" rel="noopener" tabindex="0"
                       aria-label="${isHouse ? "" : "Sponsored: "}${campaign.advertiser} — ${campaign.message}">
                        ${campaign.logo ? `<img src="${campaign.logo}" alt="" class="ad-logo" onerror="this.style.display='none'" />` : ""}
                        <span class="ad-marquee-viewport">
                            <span class="ad-marquee-content" style="--marquee-duration: ${Math.max(12, campaign.message.length / 4)}s">
                                ${labelSpan}
                                <span class="ad-advertiser">${campaign.advertiser}</span>
                                <span class="ad-message">${campaign.message}</span>
                                <span class="ad-cta">${campaign.cta} →</span>
                            </span>
                        </span>
                    </a>
                `;
            }

            const MODES = ["ad", "apps", "socials"];
            let modeIndex = 0; // start on "ad"
            let impressionObserver = null;
            let impressionFired = false;

            function currentMode() {
                return MODES[modeIndex];
            }

            function nextModeLabel() {
                const next = MODES[(modeIndex + 1) % MODES.length];
                return next.toUpperCase();
            }

            function stopImpressionTracking() {
                if (impressionObserver) {
                    impressionObserver.disconnect();
                    impressionObserver = null;
                }
            }

            function startImpressionTracking(adLinkEl, campaign) {
                if (impressionFired) return; // one impression per campaign per page view
                let visibleTimer = null;

                impressionObserver = new IntersectionObserver(
                    (entries) => {
                        entries.forEach((entry) => {
                            const eligible = entry.isIntersecting && document.visibilityState === "visible" && currentMode() === "ad";
                            if (eligible) {
                                if (!visibleTimer) {
                                    visibleTimer = setTimeout(() => {
                                        if (!impressionFired) {
                                            impressionFired = true;
                                            trackEvent("promo_impression", {
                                                campaign_id: campaign.id,
                                                advertiser: campaign.advertiser,
                                                placement: "promo-banner",
                                                campaign_type: campaign.type,
                                            });
                                        }
                                        stopImpressionTracking();
                                    }, 1000); // must be meaningfully visible for 1s
                                }
                            } else if (visibleTimer) {
                                clearTimeout(visibleTimer);
                                visibleTimer = null;
                            }
                        });
                    },
                    { threshold: 0.5 },
                );
                impressionObserver.observe(adLinkEl);

                document.addEventListener("visibilitychange", () => {
                    if (document.visibilityState !== "visible" && visibleTimer) {
                        clearTimeout(visibleTimer);
                        visibleTimer = null;
                    }
                });
            }

            function renderAd() {
                strip.innerHTML = adHTML(currentCampaign);
                const adLink = document.getElementById("adLink");
                adLink.addEventListener("click", (e) => {
                    e.preventDefault();
                    trackEvent("promo_click", {
                        campaign_id: currentCampaign.id,
                        advertiser: currentCampaign.advertiser,
                        placement: "promo-banner",
                        destination: currentCampaign.url,
                        campaign_type: currentCampaign.type,
                    });
                    window.open(withUTM(currentCampaign), "_blank", "noopener");
                });
                startImpressionTracking(adLink, currentCampaign);
            }

            function render() {
                stopImpressionTracking();
                const mode = currentMode();

                strip.classList.remove("ad-mode", "apps-mode", "socials-mode");

                if (mode === "ad") {
                    strip.classList.add("ad-mode");
                    renderAd();
                } else if (mode === "apps") {
                    strip.classList.add("apps-mode");
                    strip.innerHTML = appsHTML;
                } else {
                    strip.classList.add("socials-mode");
                    strip.innerHTML = socialsHTML;
                }

                toggleLabel.textContent = nextModeLabel();
                toggleBtn.title = "Show " + nextModeLabel().toLowerCase();
            }

            toggleBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                modeIndex = (modeIndex + 1) % MODES.length;
                render();
            });

            render();

            // Service worker
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker.register("sw.js").catch((err) => {
                        console.error("SW registration failed:", err);
                    });
                });

                let refreshing = false;
                navigator.serviceWorker.addEventListener("controllerchange", () => {
                    if (refreshing) return;
                    refreshing = true;
                    window.location.reload();
                });
            }
        </script>
    </body>
</html>
